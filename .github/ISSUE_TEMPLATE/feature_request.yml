
name: Feature Request
description: Suggest a new metric, monitoring capability, or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome! Explain the use case and how the proposed feature would improve monitoring.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues for similar suggestions.
          required: true
        - label: This suggestion is related to the Bitdefender GravityZone Zabbix template.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - Endpoint monitoring
        - Protection status
        - Outdated agents
        - Quarantine monitoring
        - Triggers and alerts
        - Dashboard and visualization
        - API integration
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or monitoring need would this feature address?
      placeholder: Describe your use case.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions you have considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add documentation links, sanitized examples, or other relevant information.
    validations:
      required: false
