                  fields:
                    - type: INTEGER
                      name: decimal_places
                      value: '0'
                    - type: INTEGER
                      name: desc_size
                      value: '10'
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'BitDefender Gravityzone by HTTP'
                        key: bitdefender.quarantine.restorable
                    - type: INTEGER
                      name: rf_rate
                      value: '10'
                    - type: INTEGER
                      name: show.0
                      value: '1'
                    - type: INTEGER
                      name: show.1
                      value: '2'
                    - type: INTEGER
                      name: show.2
                      value: '4'
                    - type: INTEGER
                      name: units_bold
                      value: '0'
                    - type: INTEGER
                      name: units_show
                      value: '0'
                - type: graph
                  name: 'Total items in quarantine'
                  'y': '9'
                  width: '24'
                  height: '6'
                  fields:
